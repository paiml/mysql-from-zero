services:
  mysql:
    image: mysql:8.4
    container_name: mysql-from-zero
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootdev
      MYSQL_DATABASE: sakila
      MYSQL_USER: app
      MYSQL_PASSWORD: appdev
    ports:
      - "3306:3306"
    volumes:
      - ./data:/var/lib/mysql
      - ./sql/01-schema:/docker-entrypoint-initdb.d:ro
    command:
      - --default-authentication-plugin=caching_sha2_password
      - --general-log=ON
      - --general-log-file=/var/log/mysql/general.log
      - --slow-query-log=ON
      - --long-query-time=0.1
