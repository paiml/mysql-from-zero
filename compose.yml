services:
  mysql:
    image: mysql:8.4
    container_name: mysql-from-zero
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootdev
      MYSQL_DATABASE: sakila
      MYSQL_USER: app
      MYSQL_PASSWORD: appdev
    ports:
      - "3306:3306"
    volumes:
      # Named volume — Docker manages lifecycle. Avoids the host-vs-container
      # UID war that bind-mounting ./data:/var/lib/mysql triggers (the mysql
      # user inside the container owns every file, so `rm -rf data` from the
      # host fails without sudo). Wipe with `make nuke`.
      - mysql_data:/var/lib/mysql
      - ./sql/01-schema:/docker-entrypoint-initdb.d:ro
    # MySQL 8.4 compatibility:
    # - `--default-authentication-plugin` was deprecated in 8.0.34 and REMOVED in 8.4;
    #   caching_sha2_password is the default and no flag is needed.
    # - General log + slow log paths point at /var/lib/mysql (writable by the mysql
    #   user) instead of /var/log/mysql (does not exist in the official image).
    command:
      - --general-log=ON
      - --general-log-file=/var/lib/mysql/general.log
      - --slow-query-log=ON
      - --slow-query-log-file=/var/lib/mysql/slow.log
      - --long-query-time=0.1
      # Sakila ships stored functions; with binary logging on (the 8.4
      # default), MySQL refuses CREATE FUNCTION unless we trust the
      # creator OR grant SUPER to the loading user. Trust is the simpler
      # dev-mode posture and is what the official Sakila docs recommend.
      - --log-bin-trust-function-creators=ON
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -prootdev --silent"]
      interval: 5s
      timeout: 3s
      retries: 24    # up to 2 minutes for first-boot Sakila auto-init
      start_period: 10s

volumes:
  mysql_data:
    name: mysql-from-zero-data
